    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // Set the theme before first paint to avoid a light-theme flash
        (function () {
            var theme = localStorage.getItem('gm-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'terminal' : 'paper');
            document.documentElement.className = 'theme-' + theme;
        })();
    </script>
